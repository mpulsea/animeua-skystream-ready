name: Rewrite AnimeUA v42

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v42.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply clean v42 player architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, base64, urllib.request, re

          repo='mpulsea/animeua-skystream-ready'
          blob='ff0cca70abb37e0779aea2ae69c6050060117323'
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{blob}',headers={'Accept':'application/vnd.github+json','User-Agent':'animeua-v42-rewrite'})
          with urllib.request.urlopen(req,timeout=20) as r:
              obj=json.load(r)
          replacement=base64.b64decode(obj['content']).decode('utf-8')

          p=Path('animeua/plugin.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function playerFileValue')
          end=s.index('globalThis.getHome=',start)
          s=s[:start]+replacement+s[end:]
          s=s.replace('skystream=41','skystream=42')
          p.write_text(s,encoding='utf-8')

          j=Path('animeua/plugin.json')
          data=json.loads(j.read_text(encoding='utf-8'))
          data['version']=42
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          r=Path('README.md')
          t=r.read_text(encoding='utf-8')
          t=re.sub(r'Current plugin version: \*\*\d+\*\*\.', 'Current plugin version: **42**.', t)
          r.write_text(t,encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check animeua/plugin.js
          node -e "const j=require('./animeua/plugin.json'); if(j.version!==42) process.exit(2)"
          grep -q 'animeua:episode:' animeua/plugin.js
          grep -q 'resolveUacdn' animeua/plugin.js
          grep -q 'resolveAshdi' animeua/plugin.js
          grep -q '/api/player/files' animeua/plugin.js
          ! grep -q 'telling-fox.workers.dev' animeua/plugin.js

      - name: Commit v42 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animeua/plugin.js animeua/plugin.json README.md
          git commit -m 'fix: rewrite AnimeUA playback with UACDN and Ashdi fallbacks v42'
          git pull --rebase origin main
          git push origin HEAD:main
