name: Patch AnimeUA v26

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-v26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch AnimeUA v26
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('animeua/plugin.js')
          s = p.read_text()

          old = "async function loadStreams(url,cb){try{var o=[],r=String(url||'').trim();if(r.indexOf('animeua:studios:')===0){var raw=decodeURIComponent(r.slice('animeua:studios:'.length)),studios=JSON.parse(raw);for(var i=0;i<studios.length;i++)addFile(o,studios[i].file,studios[i].name)}else addFile(o,r,'AnimeUA');if(!o.length)return cb({success:false,error:'AnimeUA: відеопотік не знайдено.'});cb({success:true,data:o})}catch(e){cb({success:false,error:'AnimeUA loadStreams: '+String(e)})}}"

          new = "async function warmStreams(o){try{var jobs=[],seen={};for(var i=0;i<o.length;i++){var x=o[i],u=x&&x.url?String(x.url):'';if(!u||seen[u]||!/m3u8(?:[?#]|$)/i.test(u))continue;seen[u]=1;jobs.push(getRaw(u,{'Referer':manifest.baseUrl+'/','User-Agent':UA,'Accept':'application/vnd.apple.mpegurl,application/x-mpegURL,*/*'}))}if(jobs.length)await Promise.all(jobs)}catch(e){}}\nasync function loadStreams(url,cb){try{var o=[],r=String(url||'').trim();if(r.indexOf('animeua:studios:')===0){var raw=decodeURIComponent(r.slice('animeua:studios:'.length)),studios=JSON.parse(raw);for(var i=0;i<studios.length;i++)addFile(o,studios[i].file,studios[i].name)}else addFile(o,r,'AnimeUA');if(!o.length)return cb({success:false,error:'AnimeUA: відеопотік не знайдено.'});await warmStreams(o);cb({success:true,data:o})}catch(e){cb({success:false,error:'AnimeUA loadStreams: '+String(e)})}}"

          if old not in s:
              raise SystemExit('v25 loadStreams block not found')
          s = s.replace(old, new, 1)
          s = s.replace('skystream=25', 'skystream=26')
          p.write_text(s)

          mp = Path('animeua/plugin.json')
          data = json.loads(mp.read_text())
          if data.get('version') != 25:
              raise SystemExit(f"expected v25, got {data.get('version')}")
          data['version'] = 26
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit v26
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animeua/plugin.js animeua/plugin.json
          git commit -m "perf: v26 warm AnimeUA HLS sources before playback"
          git push
