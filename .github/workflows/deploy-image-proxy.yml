name: Deploy AnimeUA Image Proxy

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-image-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deploy temporary Cloudflare Worker
        working-directory: proxy
        run: npx wrangler@latest deploy --temporary --yes
