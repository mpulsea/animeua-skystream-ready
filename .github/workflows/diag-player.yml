name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect fallback player
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://animeua.club/8376-viiskova-istoriia-malenkoi-divchynky-2.html'
          PLAYER='https://franko.uacdn.online/show/kinopoisk/1041139'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          curl -L -sS -A "$UA" -e "$PAGE" "$PLAYER" -o /tmp/player.html
          echo "bytes: $(wc -c </tmp/player.html)"
          echo '=== HTML ==='
          sed -n '1,220p' /tmp/player.html
          echo '=== URLS ==='
          grep -Eo 'https?://[^"'"'"' <>]+' /tmp/player.html | head -100 || true
          echo '=== KEYS ==='
          grep -Eio '(file|playlist|episodes|season|m3u8|hls|video|sources|api|kinopoisk)[^,;<]{0,300}' /tmp/player.html | head -120 || true
