name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect UACDN player scripts
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://franko.uacdn.online'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          for P in '/player/js/player-page.js?v=cb5336a683db' '/player/js/player_ua_22_fs.js?v=61d19af5b46a'; do
            F=/tmp/$(basename "${P%%\?*}")
            echo "=== $P ==="
            curl -L -sS -A "$UA" -e "$BASE/show/kinopoisk/1041139" "$BASE$P" -o "$F"
            echo "bytes: $(wc -c < "$F")"
            grep -Ein 'fetch\(|ajax|axios|XMLHttpRequest|\.get\(|\.post\(|/api/|/player/|episode|translation|translate|files|video|m3u8|playlist|source|media' "$F" | head -220 || true
          done
