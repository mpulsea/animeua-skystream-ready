name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect multi-season mappings
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/seasons.cjs <<'NODE'
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1';
          async function get(url,ref='https://animeua.club/'){
            const r=await fetch(url,{headers:{'User-Agent':UA,'Referer':ref},redirect:'follow'});
            return {status:r.status,url:r.url,body:await r.text()};
          }
          function attr(tag,n){const m=String(tag||'').match(new RegExp('(?:^|\\s)'+n+'\\s*=\\s*(["\\\'])(.*?)\\1','i'));return m?m[2]:''}
          function iframes(s,base){const out=[];for(const tag of (s.match(/<iframe\b[^>]*>/ig)||[])){for(const n of ['data-src','src']){const raw=attr(tag,n);if(!raw)continue;try{const u=new URL(raw.replace(/&amp;/g,'&'),base).toString();if(!out.includes(u))out.push(u)}catch{}}}return out;}
          function payload(s){const m=String(s||'').match(/window\.__PLAYER_PAYLOAD__\s*=\s*(\{[\s\S]*?\});/);if(!m)return null;try{return JSON.parse(m[1])}catch{return null}}
          function fileValue(s){const m=String(s||'').match(/\bfile\s*:\s*(['"])([\s\S]*?)\1\s*[,}]/);return m?m[2]:''}
          async function inspect(url,label){
            const p=await get(url); console.log('\n###',label,url,'PAGE',p.status,p.body.length);
            const h=p.body.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i); console.log('H1',h&&h[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());
            const ps=iframes(p.body,url).filter(u=>/ashdi\.vip|uacdn\.online/i.test(u)); console.log('PLAYERS',ps);
            for(const u of ps){const r=await get(u,url);console.log('\nPLAYER',u,'STATUS',r.status,'BYTES',r.body.length);
              const x=payload(r.body); if(x){console.log('UACDN',{id:x.id,is_serial:x.is_serial,season:x.season,episode:x.episode,seasons:x.seasons,seasons_episodes:x.seasons_episodes,translate:x.translate,translateTitle:x.translateTitle,translations:x.translations});continue;}
              const f=fileValue(r.body); console.log('ASHDI_FILE_HEAD',f.slice(0,2500));
            }
          }
          (async()=>{
            await inspect('https://animeua.club/3114-mushoku-tensei-isekai-ittara-honki-dasu.html','MUSHOKU PAGE 1');
            await inspect('https://animeua.club/2218-mushoku-tensei-isekai-ittara-honki-dasu-2.html','MUSHOKU PAGE 2');
            await inspect('https://animeua.club/8363-reinkarnaciia-bezrobitnogo-istoriia-pro-prygody-v-inshomu-sviti-3.html','MUSHOKU PAGE 3');
            await inspect('https://animeua.club/7047-haikyuu.html','HAIKYUU MULTI');
          })().catch(e=>{console.error('SEASON_DIAG_FAIL',e);process.exit(1)});
          NODE
          node /tmp/seasons.cjs
