name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate v41 movie and series playback
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/harness.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.manifest={baseUrl:'https://animeua.club'};
          for(const n of ['MultimediaItem','Episode','StreamResult']) global[n]=class {constructor(o){Object.assign(this,o)}};
          global.http_get=async(url,headers={})=>{const r=await fetch(url,{headers,redirect:'follow'});return{body:await r.text(),status:r.status,statusCode:r.status}};
          vm.runInThisContext(fs.readFileSync('animeua/plugin.js','utf8'),{filename:'plugin.js'});
          const call=(fn,...args)=>new Promise((resolve,reject)=>{let done=false;const cb=x=>{if(!done){done=true;resolve(x)}};try{fn(...args,cb)}catch(e){reject(e)};setTimeout(()=>{if(!done)reject(new Error('timeout'))},30000)});
          async function verify(target,label){
            console.log('\n===',label,target,'===');
            const loaded=await call(global.load,target);
            if(!loaded||!loaded.success) throw new Error(label+' load failed '+JSON.stringify(loaded));
            const item=loaded.data,eps=item&&item.episodes||[];
            console.log('TITLE',item&&item.title,'EPISODES',eps.length);
            if(!eps.length) throw new Error(label+' has no episodes');
            for(const e of eps){
              if(!String(e.url).startsWith('animeua:episode:')) throw new Error(label+' unstable episode token '+e.url);
              if(/ashdi\.vip|\.m3u8/i.test(String(e.url))) throw new Error(label+' leaked ephemeral URL into episode token');
            }
            const picks=[eps[0]];
            if(eps.length>1) picks.push(eps[eps.length-1]);
            for(const ep of picks){
              console.log('TOKEN',ep.episode,String(ep.url).slice(0,220));
              let firstUrl='';
              for(let pass=1;pass<=2;pass++){
                const result=await call(global.loadStreams,ep.url);
                const streams=result&&result.data||[];
                console.log('PASS',pass,'EP',ep.episode,'SUCCESS',result&&result.success,'COUNT',streams.length,'ERROR',result&&result.error);
                if(!result||!result.success||!streams.length) throw new Error(label+' ep '+ep.episode+' pass '+pass+' no streams '+JSON.stringify(result));
                const st=streams[0];
                console.log('STREAM',pass,st.source,st.url);
                if(!/^https?:\/\//i.test(st.url)) throw new Error('invalid stream url');
                if(pass===1) firstUrl=st.url;
                const r=await fetch(st.url,{headers:st.headers||{},redirect:'follow'});
                const body=await r.text();
                console.log('HTTP',r.status,'M3U8',body.startsWith('#EXTM3U'),'BYTES',body.length);
                if(!r.ok||!body.startsWith('#EXTM3U')) throw new Error(label+' stream unhealthy');
              }
              console.log('FRESH_RESOLVE_OK',ep.episode,'first=',firstUrl);
            }
          }
          (async()=>{
            await verify('https://animeua.club/8172-100-metriv.html','MOVIE');
            await verify('https://animeua.club/8375-100-divchat-iaki-duzhe-duzhe-duzhe-duzhe-duzhe-tebe-kokhaut-3.html','SERIES');
            console.log('\nV41_DIAG_OK');
          })().catch(e=>{console.error('V41_DIAG_FAIL',e);process.exit(1)});
          NODE
          node /tmp/harness.cjs
