name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect page-level episode metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/page.cjs <<'NODE'
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1';
          async function get(url){const r=await fetch(url,{headers:{'User-Agent':UA,'Referer':'https://animeua.club/'},redirect:'follow'});return await r.text()}
          async function inspect(url,label){
            const s=await get(url); console.log('\n###',label,'BYTES',s.length);
            const pats=[/сер(?:ія|ії|ій|іал)[^<]{0,120}/ig,/episode[^<]{0,120}/ig,/episodes[^<]{0,120}/ig,/season[^<]{0,120}/ig,/кільк[^<]{0,120}/ig,/випущено[^<]{0,120}/ig,/серій[^<]{0,120}/ig,/data-[^=]*(?:episode|season)[^=]*=["'][^"']+["']/ig];
            const out=[]; for(const re of pats){let m,c=0;while((m=re.exec(s))&&c<40){const a=Math.max(0,m.index-180),b=Math.min(s.length,m.index+500);out.push(s.slice(a,b).replace(/\s+/g,' '));c++;}}
            [...new Set(out)].slice(0,80).forEach(x=>console.log('SNIP',x));
            const scripts=[...s.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/ig)].map(m=>m[1]);
            for(const sc of scripts){if(/episode|season|сері/i.test(sc)) console.log('SCRIPT',sc.replace(/\s+/g,' ').slice(0,2500));}
          }
          (async()=>{
            await inspect('https://animeua.club/8172-100-metriv.html','MOVIE');
            await inspect('https://animeua.club/8375-100-divchat-iaki-duzhe-duzhe-duzhe-duzhe-duzhe-tebe-kokhaut-3.html','SERIES');
            await inspect('https://animeua.club/8376-viiskova-istoriia-malenkoi-divchynky-2.html','SERIES2');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/page.cjs
