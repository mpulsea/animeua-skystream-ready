name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test UACDN payload and files API
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/uacdn.cjs <<'NODE'
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1';
          async function req(url,opt={}){const r=await fetch(url,{redirect:'follow',...opt,headers:{'User-Agent':UA,'Referer':opt.ref||'https://animeua.club/','Origin':opt.origin||undefined,...(opt.headers||{})}});return{status:r.status,url:r.url,text:await r.text()}}
          function payloadFrom(html){const m=html.match(/window\.__PLAYER_PAYLOAD__\s*=\s*(\{[\s\S]*?\});/);if(!m)return null;return JSON.parse(m[1])}
          async function inspect(player,label){
            console.log('\n###',label,player);
            const p=await req(player,{ref:'https://animeua.club/'});console.log('PLAYER',p.status,p.text.length);
            const x=payloadFrom(p.text); if(!x) throw new Error('payload not found');
            console.log('PAYLOAD',JSON.stringify(x,null,2).slice(0,12000));
            const tests=[];
            if(x.is_serial){
              const seasons=x.seasons_episodes||{};
              for(const sk of Object.keys(seasons).slice(0,2)){
                const arr=seasons[sk]||[]; if(arr.length) tests.push({season:Number(sk),episode:Number(arr[0])}); if(arr.length>1) tests.push({season:Number(sk),episode:Number(arr[arr.length-1])});
              }
            } else tests.push({season:null,episode:null});
            for(const t of tests){
              const body={id:Number(x.id||0),translation:Number(x.translate||0),season_number:t.season,episode_number:t.episode,force_cdn:String(x.force_cdn||''),turnstile_token:''};
              const api=new URL('/api/player/files',p.url).toString();
              const r=await req(api,{method:'POST',ref:p.url,origin:new URL(p.url).origin,headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
              console.log('API',JSON.stringify(body),'STATUS',r.status,'RESP',r.text.slice(0,5000));
              try{const j=JSON.parse(r.text); const file=String(j.file||''); if(file){const first=file.split(',').pop().replace(/^\[[^\]]+\]/,''); const h=await req(first,{ref:p.url,headers:{'Accept':'application/vnd.apple.mpegurl,application/x-mpegURL,*/*'}}); console.log('STREAM',first,'HTTP',h.status,'M3U8',h.text.startsWith('#EXTM3U'),'BYTES',h.text.length)}}catch(e){console.log('PARSE_ERR',String(e))}
            }
          }
          (async()=>{
            await inspect('https://franko.uacdn.online/show/kinopoisk/7723338','MOVIE');
            await inspect('https://franko.uacdn.online/show/kinopoisk/1041139','SERIES2');
          })().catch(e=>{console.error('FAIL',e);process.exit(1)});
          NODE
          node /tmp/uacdn.cjs
