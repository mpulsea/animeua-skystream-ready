name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate v42 end to end
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/harness.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.manifest={baseUrl:'https://animeua.club'};
          for(const n of ['MultimediaItem','Episode','StreamResult']) global[n]=class {constructor(o){Object.assign(this,o)}};
          let blockAshdi=false;
          async function network(method,url,headers={},body){
            if(blockAshdi && /ashdi\.vip/i.test(url)) throw new Error('TEST_BLOCKED_ASHDI');
            const r=await fetch(url,{method,headers,body,redirect:'follow'});
            return {body:await r.text(),status:r.status,statusCode:r.status};
          }
          global.http_get=(url,headers={})=>network('GET',url,headers);
          global.http_post=(url,headers={},body='')=>network('POST',url,headers,body);
          vm.runInThisContext(fs.readFileSync('animeua/plugin.js','utf8'),{filename:'plugin.js'});
          const call=(fn,...args)=>new Promise((resolve,reject)=>{let done=false;const cb=x=>{if(!done){done=true;resolve(x)}};try{fn(...args,cb)}catch(e){reject(e)};setTimeout(()=>{if(!done)reject(new Error('timeout'))},40000)});
          async function checkStream(st,label){
            if(!st||!/^https?:\/\//i.test(st.url)) throw new Error(label+' invalid stream '+JSON.stringify(st));
            const r=await fetch(st.url,{headers:st.headers||{},redirect:'follow'}); const body=await r.text();
            console.log(label,'HTTP',r.status,'M3U8',body.startsWith('#EXTM3U'),'SOURCE',st.source,'URL',st.url.slice(0,180));
            if(!r.ok||!body.startsWith('#EXTM3U')) throw new Error(label+' unhealthy stream');
          }
          async function verify(target,label,expectedMin,expectedExact,withAshdiBlocked){
            console.log('\n===',label,'==='); blockAshdi=!!withAshdiBlocked;
            const a=await call(global.load,target); const b=await call(global.load,target);
            if(!a||!a.success||!b||!b.success) throw new Error(label+' load failure');
            const ea=a.data.episodes||[], eb=b.data.episodes||[];
            console.log('LOAD episodes',ea.length,'blockedAshdi',blockAshdi);
            if(ea.length<expectedMin) throw new Error(label+' too few episodes '+ea.length);
            if(expectedExact!=null&&ea.length!==expectedExact) throw new Error(label+' expected '+expectedExact+' episodes got '+ea.length);
            if(ea.length!==eb.length) throw new Error(label+' unstable episode count');
            for(let i=0;i<ea.length;i++){
              if(!String(ea[i].url).startsWith('animeua:episode:')) throw new Error(label+' nonstable token '+ea[i].url);
              if(ea[i].url!==eb[i].url) throw new Error(label+' token changed between loads');
              if(/ashdi\.vip|uacdn\.online|\.m3u8/i.test(ea[i].url)) throw new Error(label+' leaked provider URL into episode token');
            }
            const picks=[ea[0]]; if(ea.length>1)picks.push(ea[ea.length-1]);
            for(const ep of picks){
              for(let pass=1;pass<=2;pass++){
                const res=await call(global.loadStreams,ep.url), streams=res&&res.data||[];
                console.log('EP',ep.episode,'PASS',pass,'OK',res&&res.success,'STREAMS',streams.length,'ERROR',res&&res.error);
                if(!res||!res.success||!streams.length) throw new Error(label+' no streams ep '+ep.episode+' '+JSON.stringify(res));
                if(streams.some(s=>/субтит|\bsub\b/i.test(String(s.source||'')))) throw new Error(label+' subtitle stream leaked');
                await checkStream(streams[0],label+' E'+ep.episode+' P'+pass);
              }
            }
            blockAshdi=false;
          }
          (async()=>{
            await verify('https://animeua.club/8172-100-metriv.html','MOVIE UACDN WITHOUT ASHDI',1,1,true);
            await verify('https://animeua.club/8376-viiskova-istoriia-malenkoi-divchynky-2.html','SERIES UACDN WITHOUT ASHDI',13,13,true);
            await verify('https://animeua.club/8375-100-divchat-iaki-duzhe-duzhe-duzhe-duzhe-duzhe-tebe-kokhaut-3.html','SERIES ASHDI',10,10,false);
            console.log('\nV42_DIAG_OK');
          })().catch(e=>{console.error('V42_DIAG_FAIL',e);process.exit(1)});
          NODE
          node /tmp/harness.cjs
