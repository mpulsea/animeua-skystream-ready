name: Diagnose AnimeUA player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-player.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute current plugin end to end
        shell: bash
        run: |
          cat > /tmp/harness.cjs <<'NODE'
          const fs=require('fs'), vm=require('vm');
          global.manifest={baseUrl:'https://animeua.club'};
          for(const n of ['MultimediaItem','Episode','StreamResult']) global[n]=class {constructor(o){Object.assign(this,o)}};
          global.http_get=async function(url,headers={}){
            const r=await fetch(url,{headers,redirect:'follow'});
            return {body:await r.text(),status:r.status,statusCode:r.status};
          };
          const code=fs.readFileSync('animeua/plugin.js','utf8');
          vm.runInThisContext(code,{filename:'plugin.js'});
          const call=(fn,...args)=>new Promise((resolve,reject)=>{let done=false; const cb=x=>{if(done)return;done=true;resolve(x)}; try{fn(...args,cb)}catch(e){reject(e)}; setTimeout(()=>{if(!done)reject(new Error('timeout'))},30000)});
          (async()=>{
            const target='https://animeua.club/8172-100-metriv.html';
            const loaded=await call(global.load,target);
            console.log('LOAD_SUCCESS',loaded&&loaded.success,'ERROR',loaded&&loaded.error);
            const item=loaded&&loaded.data;
            console.log('TITLE',item&&item.title);
            console.log('DESCRIPTION',String(item&&item.description||'').slice(-500));
            console.log('EPISODES',item&&item.episodes&&item.episodes.length);
            if(item&&item.episodes) item.episodes.forEach((e,i)=>console.log('EP',i,JSON.stringify({name:e.name,url:e.url,episode:e.episode}).slice(0,1000)));
            if(!item||!item.episodes||!item.episodes.length) process.exit(2);
            for(let i=0;i<item.episodes.length;i++){
              const ep=item.episodes[i];
              const streams=await call(global.loadStreams,ep.url);
              console.log('STREAM_RESULT_EP',i,'success=',streams&&streams.success,'error=',streams&&streams.error,'count=',streams&&streams.data&&streams.data.length);
              if(streams&&streams.data) for(const s of streams.data) console.log('STREAM',JSON.stringify(s));
            }
          })().catch(e=>{console.error('HARNESS_FATAL',e);process.exit(1)});
          NODE
          node /tmp/harness.cjs
