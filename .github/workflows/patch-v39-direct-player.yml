name: Patch v39 direct player extraction once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v39-direct-player.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch AnimeUA v39
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('animeua/plugin.js')
          s = p.read_text()

          pat = re.compile(r"async function playerDebug\(s,pageUrl\)\{.*?\}\n(?=function episodeNumber)", re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('playerDebug block not found')

          new = r'''function playerIframeUrl(s,base){var tags=String(s||'').match(/<iframe\b[^>]*>/ig)||[],names=['data-src','src','data-url','data-player','data-frame','data-video'];for(var i=0;i<tags.length;i++){for(var j=0;j<names.length;j++){var raw=attr(tags[i],names[j]);if(!raw||/^(?:about:|javascript:)/i.test(raw))continue;try{var u=new URL(dec(raw),base||manifest.baseUrl+'/').toString();if(u)return u}catch(e){}}}var pats=[/(?:iframe|player|video|embed|src|url)\s*[:=]\s*["']([^"']+)["']/i,/["']((?:https?:)?\/\/[^"']*(?:player|embed|video)[^"']*)["']/i];for(var k=0;k<pats.length;k++){var x=String(s||'').match(pats[k]);if(x)try{return new URL(dec(x[1]),base||manifest.baseUrl+'/').toString()}catch(e){}}return''}
async function playerDebug(s,pageUrl){var d={iframe:false,player:false,file:false,playerLen:0,fileType:'none',error:'',status:0,attempt:0};try{var pf=playerFileValue(s);if(pf){d.player=true;d.file=true;d.playerLen=s.length;d.fileType=/^https?:\/\//i.test(pf)?'url':(pf.charAt(0)==='['?'array':'other');return{file:pf,debug:d}}var current=playerIframeUrl(s,pageUrl||manifest.baseUrl+'/'),ref=pageUrl||manifest.baseUrl+'/',rr,body='';for(var depth=0;current&&depth<3;depth++){d.iframe=true;var hs={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Referer':ref};try{var ru=new URL(current);if(ru&&ru.origin)hs['Origin']=depth===0?manifest.baseUrl:ru.origin}catch(e){}rr=await getRaw(current,hs);d.attempt=depth+1;d.status=rr.status||d.status;if(rr.error)d.error=rr.error;if(!rr.body)break;body=rr.body;d.player=true;d.playerLen=body.length;pf=playerFileValue(body);if(pf)break;var next=playerIframeUrl(body,current);if(!next||next===current)break;ref=current;current=next}d.file=!!pf;if(pf)d.fileType=/^https?:\/\//i.test(pf)?'url':(pf.charAt(0)==='['?'array':'other');return{file:pf,debug:d}}catch(e){d.error=String(e).slice(0,120);return{file:null,debug:d}}}
'''

          s = s[:m.start()] + new + s[m.end():]
          s = s.replace('skystream=36', 'skystream=39')
          p.write_text(s)

          mp = Path('animeua/plugin.json')
          data = json.loads(mp.read_text())
          data['version'] = 39
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/patch-v39-direct-player.yml').unlink()
          PY

      - name: Commit v39
        run: |
          git config user.name "mpulsea"
          git config user.email "mpulsea@gmail.com"
          git add -A
          git commit -m "fix: extract AnimeUA player directly without Worker in v39"
          git pull --rebase origin main
          git push origin HEAD:main
