name: Patch v39 direct player

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-v39-direct-player.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_v39.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/patch-v39-direct-player.yml .github/scripts/patch_v39.py
          git config user.name "mpulsea"
          git config user.email "mpulsea@gmail.com"
          git add -A
          git commit -m "fix: extract AnimeUA player directly without Worker in v39"
          git pull --rebase origin main
          git push origin HEAD:main
