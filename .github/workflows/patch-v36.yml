name: Patch AnimeUA v36

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v36.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply v36 patch
        run: python3 .github/scripts/patch_v36.py
      - name: Commit v36
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animeua/plugin.js animeua/plugin.json
          git commit -m "fix: v36 use active AnimeUA worker endpoint"
          git pull --rebase origin main
          git push origin HEAD:main
