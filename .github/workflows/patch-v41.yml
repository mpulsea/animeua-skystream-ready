name: Patch AnimeUA v41 stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v41.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply stable episode-token architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, base64
          p=Path('animeua/plugin.js')
          s=p.read_text()
          if 'skystream=40' not in s or 'AnimeUA v40' not in s: raise SystemExit('Expected v40 source not found')
          s=s.replace('skystream=40','skystream=41')
          marker="function packStudios(list){return'animeua:studios:'+encodeURIComponent(JSON.stringify(list))}"
          if marker not in s: raise SystemExit('packStudios marker not found')
          extra="function packEpisode(page,episode){return'animeua:episode:'+encodeURIComponent(JSON.stringify({page:String(page||''),episode:parseInt(episode,10)||1}))}\nfunction unpackEpisode(token){try{return JSON.parse(decodeURIComponent(String(token||'').slice('animeua:episode:'.length)))}catch(e){return null}}"
          s=s.replace(marker,marker+'\n'+extra,1)
          new_load=base64.b64decode('').decode()
          a=s.index('async function load(url,cb){'); b=s.index('\nfunction normQuality',a); s=s[:a]+new_load+s[b:]
          new_streams=base64.b64decode('').decode()
          a=s.index('async function loadStreams(url,cb){'); b=s.index('\nglobalThis.getHome=',a); s=s[:a]+new_streams+s[b:]
          s=s.replace('AnimeUA v40','AnimeUA v41')
          p.write_text(s)
          j=Path('animeua/plugin.json'); data=json.loads(j.read_text()); data['version']=41; j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          r=Path('README.md'); t=r.read_text(); t=re.sub(r'Current plugin version: \*\*\d+\*\*\.', 'Current plugin version: **41**.', t); r.write_text(t)
          PY
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check animeua/plugin.js
          node -e "const j=require('./animeua/plugin.json'); if(j.version!==41) process.exit(2)"
          grep -q 'animeua:episode:' animeua/plugin.js
          grep -q 'freshEpisodeStreams' animeua/plugin.js
          ! grep -q 'url:pf,season' animeua/plugin.js
          ! grep -q 'url:packStudios(studios)' animeua/plugin.js
      - name: Commit v41 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animeua/plugin.js animeua/plugin.json README.md
          git commit -m 'fix: resolve fresh AnimeUA streams at playback in v41'
          git pull --rebase origin main
          git push origin HEAD:main
