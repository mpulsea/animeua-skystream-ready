name: Patch AnimeUA v27

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-v27.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch AnimeUA v27
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('animeua/plugin.js')
          s = p.read_text()

          old = "async function warmStreams(o){try{var jobs=[],seen={};for(var i=0;i<o.length;i++){var x=o[i],u=x&&x.url?String(x.url):'';if(!u||seen[u]||!/m3u8(?:[?#]|$)/i.test(u))continue;seen[u]=1;jobs.push(getRaw(u,{'Referer':manifest.baseUrl+'/','User-Agent':UA,'Accept':'application/vnd.apple.mpegurl,application/x-mpegURL,*/*'}))}if(jobs.length)await Promise.all(jobs)}catch(e){}}"

          new = "async function warmOne(u){var hs={'Referer':manifest.baseUrl+'/','User-Agent':UA,'Accept':'application/vnd.apple.mpegurl,application/x-mpegURL,*/*'};for(var n=0;n<3;n++){try{var r=await getRaw(u,hs);if(r&&r.body&&(!r.status||r.status<400))return true}catch(e){}}return false}\nasync function warmStreams(o){try{var jobs=[],seen={};for(var i=0;i<o.length;i++){var x=o[i],u=x&&x.url?String(x.url):'';if(!u||seen[u]||!/m3u8(?:[?#]|$)/i.test(u))continue;seen[u]=1;jobs.push(warmOne(u))}if(jobs.length)await Promise.all(jobs)}catch(e){}}"

          if old not in s:
              raise SystemExit('v26 warmStreams block not found')
          s = s.replace(old, new, 1)
          s = s.replace('skystream=26', 'skystream=27')
          p.write_text(s)

          mp = Path('animeua/plugin.json')
          data = json.loads(mp.read_text())
          if data.get('version') != 26:
              raise SystemExit(f"expected v26, got {data.get('version')}")
          data['version'] = 27
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit v27
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animeua/plugin.js animeua/plugin.json
          git commit -m "perf: v27 retry AnimeUA HLS readiness before SkyStream probes"
          git push
