name: Patch AnimeUA v35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v35.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply v35 patch
        run: python3 .github/scripts/patch_v35.py
      - name: Commit v35
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animeua/plugin.js animeua/plugin.json proxy/src/index.js
          git commit -m "fix: v35 modern AnimeUA player discovery and relay"
          git pull --rebase origin main
          git push origin HEAD:main
