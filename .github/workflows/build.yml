name: Build and Deploy Repository

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
      - 'repo.json'
      - 'repo-v2.json'
      - 'repo-v3.json'
      - 'repo-v4.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animeua-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply AnimeUA v20 compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('animeua/plugin.js')
          s = p.read_text(encoding='utf-8')

          if 'function playerFileValue(' not in s:
              replacement = r'''function playerFileValue(ph){var m=/\bfile\s*:/.exec(ph||'');if(!m)return null;var i=m.index+m[0].length,n=ph.length;while(i<n&&/\s/.test(ph.charAt(i)))i++;if(i>=n)return null;var q=ph.charAt(i);if(q==='"'||q==="'"||q==='`'){i++;var out='',esc=false;for(;i<n;i++){var c=ph.charAt(i);if(esc){out+=c;esc=false;continue}if(c==='\\'){esc=true;out+=c;continue}if(c===q)break;out+=c}return dec(out).replace(/\\(["'\/])/g,'$1')}if(q==='['){var start=i,depth=0,str='',esc2=false;for(;i<n;i++){var ch=ph.charAt(i);if(str){if(esc2){esc2=false;continue}if(ch==='\\'){esc2=true;continue}if(ch===str)str='';continue}if(ch==='"'||ch==="'"||ch==='`'){str=ch;continue}if(ch==='[')depth++;else if(ch===']'){depth--;if(depth===0)return dec(ph.slice(start,i+1))}}}var r=ph.slice(i).match(/^(https?:\/\/[^\s,}]+)/i);return r?dec(r[1]):null}
async function player(s){var f=s.match(/<div[^>]*class=["'][^"']*video-inside[^"']*["'][^>]*>[\s\S]*?<iframe[^>]*(?:data-src|src)=["']([^"']+)["'][^>]*>/i)||s.match(/<iframe[^>]*(?:data-src|src)=["']([^"']+)["'][^>]*>/i);if(!f)return null;var pu=abs(f[1]),ph=await html(pu,{'User-Agent':UA,'Referer':manifest.baseUrl+'/'});return playerFileValue(ph)}
function episodeNumber'''
              s2, count = re.subn(
                  r'async function player\(s\)\{.*?\}\nfunction episodeNumber',
                  replacement,
                  s,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Could not patch AnimeUA player()')
              s = s2

          s = s.replace('skystream=19', 'skystream=20')
          s = s.replace(
              'inari|didko|sundragon|sun dragon|робота голосом|hatoshi|білі джин|48 volts|amanogawa|molfar|adrian zax|melodicvoice|lifecycle',
              'inari|didko|sundragon|sun dragon|робота голосом|рідний голос|ridnyi holos|ashdi|moonanime|togarashi|fanvox|далі буде|ukrainefastdub|aniua|vrdub|jenary|hatoshi|білі джин|48 volts|amanogawa|molfar|adrian zax|melodicvoice|lifecycle'
          )
          s = s.replace(
              "[/робота\\s+голосом/i,'Робота Голосом'],",
              "[/робота\\s+голосом/i,'Робота Голосом'],[/рідний\\s+голос|ridnyi\\s+holos/i,'Рідний Голос'],[/ashdi/i,'ASHDI'],[/moonanime/i,'MOONANIME'],[/togarashi/i,'Togarashi'],[/fanvox/i,'FanVoxUA'],[/далі\\s+буде/i,'Далі Буде'],[/ukrainefastdub/i,'UkraineFastDUB'],[/aniua/i,'AniUa'],[/vrdub/i,'VRdub'],[/jenary/i,'Jenary'],"
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Deploy SkyStream repository
        run: |
          npm install -g skystream-cli
          skystream deploy -u https://raw.githubusercontent.com/${{ github.repository }}/main

          VERSION=$(node -p "require('./animeua/plugin.json').version")
          VERSIONED_PACKAGE="dist/com.anva.animeua-v${VERSION}.sky"
          cp dist/com.anva.animeua.sky "$VERSIONED_PACKAGE"

          cp dist/plugins.json dist/plugins-v2.json
          cp dist/plugins.json dist/plugins-v3.json
          cp dist/plugins.json dist/plugins-v4.json

          node - <<'NODE'
          const fs = require('fs');
          const version = require('./animeua/plugin.json').version;
          const packageUrl = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/main/dist/com.anva.animeua-v${version}.sky`;
          for (const file of ['dist/plugins.json', 'dist/plugins-v2.json', 'dist/plugins-v3.json', 'dist/plugins-v4.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const plugin of data) {
              if (plugin.packageName === 'com.anva.animeua') plugin.url = packageUrl;
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: deploy SkyStream repository [skip ci]" || echo "No changes to commit"
          git push
