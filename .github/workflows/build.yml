name: Build AnimeUA Repository

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'repo.json'
      - 'repo-v4.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animeua-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build repository
        run: |
          npm install -g skystream-cli
          skystream deploy -u https://raw.githubusercontent.com/${{ github.repository }}/main

          VERSION=$(node -p "require('./animeua/plugin.json').version")

          find dist -maxdepth 1 -type f -name 'com.anva.animeua-v*.sky' -delete
          rm -f dist/plugins-v2.json dist/plugins-v3.json dist/plugins-v22-direct.json
          rm -rf animeua/.build

          cp dist/com.anva.animeua.sky "dist/com.anva.animeua-v${VERSION}.sky"

          node - <<'NODE'
          const fs = require('fs');
          const version = require('./animeua/plugin.json').version;
          const packageUrl = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/main/dist/com.anva.animeua-v${version}.sky`;
          const data = JSON.parse(fs.readFileSync('dist/plugins.json', 'utf8'));
          for (const plugin of data) {
            if (plugin.packageName === 'com.anva.animeua') plugin.url = packageUrl;
          }
          const json = JSON.stringify(data, null, 2) + '\n';
          fs.writeFileSync('dist/plugins.json', json);
          // Compatibility only for devices that already added the old repository URL.
          fs.writeFileSync('dist/plugins-v4.json', json);
          NODE

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: build AnimeUA repository [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
