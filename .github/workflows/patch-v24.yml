name: Patch AnimeUA v24

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-v24.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch plugin to use relay fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('animeua/plugin.js')
          s = p.read_text()
          proxy = 'https://animeua-image-proxy.wholesale-source.workers.dev'
          new_func = r'''async function playerDebug(s,pageUrl){var d={iframe:false,player:false,file:false,playerLen:0,fileType:'none',error:'',status:0,attempt:0};try{var f=s.match(/<div[^>]*class=["'][^"']*video-inside[^"']*["'][^>]*>[\s\S]*?<iframe[^>]*(?:data-src|src)=["']([^"']+)["'][^>]*>/i)||s.match(/<iframe[^>]*(?:data-src|src)=["']([^"']+)["'][^>]*>/i);if(!f)return{file:null,debug:d};d.iframe=true;var pu=abs(f[1]),ph='',rr=await getRaw(pu,{});d.attempt=1;d.status=rr.status||0;if(rr.body){ph=rr.body}else{var relay=''' + repr(proxy + '/player?page=') + r'''+encodeURIComponent(pageUrl||manifest.baseUrl+'/');rr=await getRaw(relay,{});d.attempt=9;d.status=rr.status||0;if(rr.error)d.error=rr.error;if(rr.body)ph=rr.body}d.player=!!ph;d.playerLen=ph?ph.length:0;if(!ph)return{file:null,debug:d};var pf=playerFileValue(ph);d.file=!!pf;if(pf)d.fileType=/^https?:\/\//i.test(pf)?'url':(pf.charAt(0)==='['?'array':'other');return{file:pf,debug:d}}catch(e){d.error=String(e).slice(0,120);return{file:null,debug:d}}}'''

          pat = r'async function playerDebug\(s,pageUrl\)\{.*?\}\nfunction episodeNumber'
          ns, n = re.subn(pat, lambda m: new_func + '\nfunction episodeNumber', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('playerDebug function not found')
          ns = ns.replace('skystream=23', 'skystream=24')
          ns = ns.replace('[DEBUG v23]', '[DEBUG v24]')
          p.write_text(ns)

          mp = Path('animeua/plugin.json')
          data = json.loads(mp.read_text())
          data['version'] = 24
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit v24
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animeua/plugin.js animeua/plugin.json
          git commit -m "fix: v24 relay PlayerJS through Cloudflare on Windows and Android"
          git push
