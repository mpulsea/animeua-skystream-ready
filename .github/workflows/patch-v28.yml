name: Patch AnimeUA v28

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-v28.yml
      - .github/scripts/patch_v28.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply v28 patch
        run: python3 .github/scripts/patch_v28.py
      - name: Commit v28
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proxy/src/index.js animeua/plugin.js animeua/plugin.json
          git commit -m "perf: v28 relay cached HLS manifests for faster startup"
          git push
