name: Patch AnimeUA v25

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-v25.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch AnimeUA v25
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('animeua/plugin.js')
          s = p.read_text()

          def replace_between(text, start, end, replacement):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'start marker not found: {start}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'end marker not found: {end}')
              return text[:a] + replacement + '\n' + text[b:]

          s = s.replace('skystream=24', 'skystream=25')

          image_block = r'''function bestSrcset(tag){var raw=attr(tag,'data-srcset')||attr(tag,'srcset');if(!raw)return'';var parts=raw.split(','),best='',score=-1;for(var i=0;i<parts.length;i++){var z=parts[i].trim().split(/\s+/),u=z[0]||'',d=z[1]||'',n=parseFloat(d)||i;if(/w$/i.test(d))n=parseFloat(d)||n;else if(/x$/i.test(d))n=(parseFloat(d)||1)*1000;if(validImage(u)&&n>=score){best=u;score=n}}return best}
function imageFromBlock(b){var tags=String(b||'').match(/<img\b[^>]*>/ig)||[];for(var i=0;i<tags.length;i++){var hi=bestSrcset(tags[i]);if(hi)return directPoster(hi);var names=['data-original','data-lazy-src','data-src','src'];for(var j=0;j<names.length;j++){var u=attr(tags[i],names[j]);if(validImage(u))return directPoster(u)}}return FALLBACK_IMAGE}
function detailPoster(s){var block=s.match(/<div[^>]*class=["'][^"']*pmovie__poster[^"']*["'][^>]*>[\s\S]*?<\/div>/i);if(block){var p=imageFromBlock(block[0]);if(p!==FALLBACK_IMAGE)return p}var og=meta(s,'og:image');if(validImage(og))return directPoster(og);var tags=s.match(/<img\b[^>]*>/ig)||[];for(var i=0;i<tags.length;i++){var hi=bestSrcset(tags[i]);if(hi)return directPoster(hi)}return FALLBACK_IMAGE}
function detailBanner(s,poster){var og=meta(s,'og:image');if(validImage(og)){var u=directPoster(og);if(u&&u!==poster)return u}var m=s.match(/(?:background-image\s*:\s*url\(|data-bg\s*=\s*["'])(https?:\/\/[^"')\s]+)/i);if(m&&validImage(m[1]))return directPoster(m[1]);return poster}'''
          s = replace_between(s, 'function imageFromBlock', 'function cleanTitle', image_block)

          load_block = r'''async function load(url,cb){try{var s=await html(url);if(!s)return cb({success:false,error:'AnimeUA: сторінка недоступна.'});var h=s.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i),title=h?cleanTitle(h[1]):cleanTitle(meta(s,'og:title')||'AnimeUA'),poster=detailPoster(s),banner=detailBanner(s,poster),dm=s.match(/<div class=["'][^"']*page__text[^"']*["'][^>]*>([\s\S]*?)<\/div>/i),normalDesc=dm?txt(dm[1]):'',eps=[],pd=await playerDebug(s,url),pf=pd.file;if(pf){if(/^https?:\/\//i.test(pf)){eps.push(new Episode({name:'Серія 1',url:pf,season:1,episode:1,dubStatus:'dubbed',posterUrl:poster}))}else try{var a=[],cfg=JSON.parse(pf);flat(cfg,a,[],1);var g=groupEpisodes(a);for(var i=0;i<g.nums.length;i++){var n=g.nums[i],studios=uniqueStudios(g.by[n]);if(!studios.length)continue;eps.push(new Episode({name:'Серія '+n,url:packStudios(studios),season:1,episode:n,dubStatus:'dubbed',posterUrl:poster}))}}catch(e){}}cb({success:true,data:new MultimediaItem({title:title,url:url,posterUrl:poster,bannerUrl:banner,type:'anime',description:normalDesc,episodes:eps})})}catch(e){cb({success:false,error:'AnimeUA load: '+String(e)})}}'''
          s = replace_between(s, 'async function load(url,cb)', 'function add(', load_block)

          stream_block = r'''function normQuality(q,u){var s=String(q||'')+' '+String(u||'');if(/2160|4k|uhd/i.test(s))return'2160p';if(/1440/i.test(s))return'1440p';if(/1080|full\s*hd|fhd/i.test(s))return'1080p';if(/720|\bhd\b/i.test(s))return'720p';if(/480|\bsd\b/i.test(s))return'480p';if(/360/i.test(s))return'360p';return'Auto'}
function qualityRank(q){var m=String(q||'').match(/(2160|1440|1080|720|480|360)/);return m?parseInt(m[1],10):0}
function add(o,u,q,source){var nq=normQuality(q,u);o.push(new StreamResult({url:dec(u),quality:nq,source:source||'AnimeUA',headers:{'Referer':manifest.baseUrl+'/','User-Agent':UA}}))}
function addFile(o,file,source){var r=dec(String(file||'').trim()),m,re=/\[([^\]]+)\](https?:\/\/[^,\s]+)/g,arr=[],seen={};while((m=re.exec(r))!==null){var u=dec(m[2]),q=normQuality(m[1],u);if(!seen[u]){seen[u]=1;arr.push({u:u,q:q})}}if(!arr.length&&/^https?:\/\//i.test(r))arr.push({u:r,q:normQuality('',r)});arr.sort(function(a,b){return qualityRank(b.q)-qualityRank(a.q)});for(var i=0;i<arr.length;i++)add(o,arr[i].u,arr[i].q,source)}'''
          s = replace_between(s, 'function add(', 'async function loadStreams', stream_block)

          p.write_text(s)

          mp = Path('animeua/plugin.json')
          data = json.loads(mp.read_text())
          data['version'] = 25
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit v25
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animeua/plugin.js animeua/plugin.json
          git commit -m "feat: v25 clean details, sharper artwork, normalize video quality"
          git push
